[project]
name = "similo-ai-service"
version = "0.1.0"
description = "Similo AI service: similarity analysis, OCR, risk scoring and RAG."
readme = "README.md"
# Python 3.12 is chosen deliberately: heavy ML/OCR libraries planned for later phases
# (PyTorch, sentence-transformers, PaddleOCR) have the most reliable wheels for 3.12.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.2",
    "fastembed>=0.9.1",
    "imagehash>=4.3.2",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.2",
    "rapidocr>=3.10.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Slow tests (real models) are skipped by default; run them with:  uv run pytest -m slow
addopts = "-ra -m 'not slow'"
markers = ["slow: loads the real AI models (about 10 seconds); run with -m slow"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax, S: security (bandit)
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# `assert` is the normal way to write pytest tests; fake tokens in tests are not secrets.
"tests/**" = ["S101", "S105", "S106"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
