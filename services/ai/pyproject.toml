[project]
name = "similo-ai-service"
version = "0.1.0"
description = "Similo AI service: similarity analysis, OCR, risk scoring and RAG."
readme = "README.md"
# Python 3.12 is chosen deliberately: heavy ML/OCR libraries planned for later phases
# (PyTorch, sentence-transformers, PaddleOCR) have the most reliable wheels for 3.12.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.2",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax, S: security (bandit)
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# `assert` is the normal way to write pytest tests.
"tests/**" = ["S101"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
