services:
  - type: web
    name: similo-ai
    runtime: python
    rootDir: ai
    region: singapore
    plan: free
    buildCommand: pip install .
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AI_ENVIRONMENT
        value: production
      - key: AI_LOG_LEVEL
        value: INFO
